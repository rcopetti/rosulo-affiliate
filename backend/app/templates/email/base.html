<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Rosulo Affiliate{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
          <tr>
            <td style="height:4px;background-color:#0ea5e9;border-radius:4px 4px 0 0;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;padding:24px 32px 8px;">
              <span style="font-size:18px;font-weight:700;letter-spacing:0.5px;color:#0369a1;">ROSULO <span style="color:#0ea5e9;">AFFILIATE</span></span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;padding:16px 32px 32px;color:#334155;font-size:14px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;text-align:center;color:#94a3b8;font-size:12px;line-height:1.5;">
              <p style="margin:0 0 4px;">Rosulo Affiliate — affiliate tracking &amp; payouts</p>
              <p style="margin:0;">This is an automated message, please do not reply.</p>
              <p style="margin:8px 0 0;">&copy; {{ year }} Rosulo Affiliate. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
